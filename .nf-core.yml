lint:
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/nf-core-fspassemblypipeline_logo_light.png
  files_unchanged:
    - assets/nf-core-fspassemblypipeline_logo_light.png
    - docs/images/nf-core-fspassemblypipeline_logo_light.png
    - docs/images/nf-core-fspassemblypipeline_logo_dark.png
    - .gitignore
  included_configs: false
  multiqc_config: false
nf_core_version: 4.2.1
repository_type: pipeline
template:
  author: Lia Obinu, Niall Garvey, Wu Huang, Chris Wyatt, Fernando Duarte Frutos
  description: Genome assembly pipeline for the Fungarium Sequencing Project, designed
    to process and assemble genomes from Illumina short reads to be used for research
    and biodiversity studies.
  force: false
  is_nfcore: true
  name: fspassemblypipeline
  org: nf-core
  outdir: .
  skip_features:
    - igenomes
    - gpu
  version: 1.0.0
