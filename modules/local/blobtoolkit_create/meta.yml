# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
# # TODO nf-core: Add a description of the module and list keywords
name: "blobtoolkit"
description: write your description here
keywords:
  - sort
  - example
  - genomics
tools:
  ## TODO nf-core: Add a description and other details for the software below
  - "blobtoolkit":
      description: "Interactive quality assessment of genome assemblies."
      homepage: "https://blobtoolkit.genomehubs.org"
      documentation: "https://blobtoolkit.genomehubs.org"
      tool_dev_url: "https://github.com/blobtoolkit/blobtoolkit"
      doi: ""
      licence: ["MIT"]
      identifier: biotools:BlobToolKit

input:
  - bam:
      type: file
      description: Sorted BAM/CRAM/SAM file
      pattern: "*.{bam,cram,sam}"
      ontologies:
        - edam: http://edamontology.org/format_2572 # BAM
        - edam: http://edamontology.org/format_2573 # CRAM
        - edam: http://edamontology.org/format_3462 # SAM
output:
  bam:
    - "*.bam":
        type: file
        description: Sorted BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies:
          - edam: http://edamontology.org/format_2572 # BAM
          - edam: http://edamontology.org/format_2573 # CRAM
          - edam: http://edamontology.org/format_3462 # SAM
  versions_blobtoolkit:
    - - ${task.process}:
          type: string
          description: The name of the process
      - blobtoolkit:
          type: string
          description: The name of the tool
      - blobtoolkit --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - blobtoolkit:
          type: string
          description: The name of the tool
      - blobtoolkit --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@NiallG1"
maintainers:
  - "@NiallG1"
