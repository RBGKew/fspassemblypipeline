# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "PREPROCESSING"
description: Perform raw-read QC, adapter/quality trimming, merged-read generation, k-mer profiling, and summary statistics.
keywords:
  - Illumina pair-end raw read processing
  - qc
  - reads
  - fastp
  - falco
  - fastk
  - genomescope2
components:
  - nf-core/falco
  - nf-core/fastp
  - nf-core/fastk/fastk
  - nf-core/genomescope2
  - local/falco_qcstat_compiling
  - local/fqstat
  - local/fqstat_summary
  - local/kmer_stat_summary
input:
  - ch_samplesheet:
      type: file
      description: |
        Input channel of raw reads and metadata.
        Structure: [ val(meta), path(reads) ]
      pattern: "*.{fastq,fq}.gz"
output:
  - fastp_reads:
      type: file
      description: |
        Trimmed reads from FASTP.
        Structure: [ val(meta), path(reads) ]
      pattern: "*.fastp.fastq.gz"
  - fastp_reads_merged:
      type: file
      description: |
        Merged reads from FASTP.
        Structure: [ val(meta), path(reads_merged) ]
      pattern: "*.merged.fastq.gz"
  - falco_raw_html:
      type: file
      description: |
        Falco HTML reports for raw reads.
        Structure: [ val(meta), path(html) ]
      pattern: "*.html"
  - falco_after_fastp_html:
      type: file
      description: |
        Falco HTML reports for FASTP-processed reads.
        Structure: [ val(meta), path(html) ]
      pattern: "*.html"
  - falco_qc_stats:
      type: file
      description: |
        Compiled Falco QC table per QC stage.
        Structure: [ val(qc_subdir), path(fastQC_result.txt) ]
      pattern: "fastQC_result.txt"
  - fq_stats:
      type: file
      description: |
        Per-file sequence statistics generated by fq_n50.pl.
        Structure: [ val(meta), path("*.stats") ]
      pattern: "*.stats"
  - fq_stats_summary:
      type: file
      description: |
        Batch-level text summaries of merged and trimmed read statistics.
        Structure: [ path("z_states_for_spreadsheet/*txt") ]
      pattern: "*txt"
  - fastk_hist:
      type: file
      description: |
        FastK histogram files.
        Structure: [ val(meta), path("*.hist") ]
      pattern: "*.hist"
  - histex_txt:
      type: file
      description: |
        Histograms reformatted by FASTK_HISTEX.
        Structure: [ val(meta), path("*.hist.txt") ]
      pattern: "*.hist.txt"
  - fastk_ktab:
      type: file
      description: |
        FastK k-table files.
        Structure: [ val(meta), path("*.ktab*") ]
      pattern: "*.ktab*"
  - genomescope_summary:
      type: file
      description: |
        GenomeScope2 summary reports.
        Structure: [ val(meta), path("*_summary.txt") ]
      pattern: "*_summary.txt"
  - kmer_stats_summary:
      type: file
      description: |
        Batch-level automated k-mer profile summary table.
        Structure: [ path("statistics/kmer_profile_statistics_automated.csv") ]
      pattern: "kmer_profile_statistics_automated.csv"
  - versions:
      type: file
      description: |
        Aggregated software version information from modules.
        Structure: mixed version channel used by the parent workflow for final version collation.
      pattern: "versions.yml"
authors:
  - "@Hazelhuangup"
maintainers:
  - "@Hazelhuangup"
